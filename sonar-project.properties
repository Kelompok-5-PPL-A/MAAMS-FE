sonar.projectKey=${env.SONAR_PROJECT}
sonar.organization=${env.SONAR_ORGANIZATION}
sonar.host.url=${env.SONAR_HOST_URL}
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src/__tests__
sonar.lang.patterns.ts=**/*.ts,**/*.tsx
sonar.lang.patterns.js=**/*.js,**/*.jsx
sonar.exclusions=**/node_modules/**, **/*.d.ts, **/*.js,**/*.jsx, **/__tests__/**, **/*.yml, **/*.css
sonar.sourceEncoding=UTF-8

sonar.javascript.file.suffixes=.js,.jsx,.ts,.tsx
sonar.typescript.lcov.reportPaths=coverage/lcov.info