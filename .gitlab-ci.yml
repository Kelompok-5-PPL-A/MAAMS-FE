variables:
 SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
 GIT_DEPTH: "0"

stages:
  - test
  - sonarcloud-check
  - deploy

default:
  image: node:20.11.0

test:
  image: node:latest
  stage: test
  before_script:
    - npm install
  script:
    - npm run test:ci
  coverage: /All files\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*[\d.]+\s*\|\s*([\d.]+)\s*\|/
  artifacts:
    paths:
      - coverage/
    when: always
    reports:
      junit:
        - junit.xml
  tags:
    - runner-randi

sonarcloud-check:
 stage: sonarcloud-check
 image:
   name: sonarsource/sonar-scanner-cli:latest
   entrypoint: [""]
 cache:
   key: "${CI_JOB_NAME}"
   paths:
     - .sonar/cache
 script:
   - sonar-scanner
 tags:
    - runner-randi

deploy_staging:
  stage: deploy
  only:
    - staging
  script:
    - npm install --global vercel
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN_STAGING
    - vercel build --prod --token=$VERCEL_TOKEN_STAGING
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN_STAGING --scope=$VERCEL_ORG_ID

deploy_production:
  stage: deploy
  only:
    - main
    - hotfix
  script:
    - npm install --global vercel
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_MAIN_ORG
